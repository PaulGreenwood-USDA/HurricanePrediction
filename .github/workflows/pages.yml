name: Build and deploy static dashboard to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Refresh every hour (cron is UTC)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read   # history commit is now in the commit-history job
  pages: write
  id-token: write

# Only one Pages deploy at a time; never cancel an in-progress deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Run tests before building so a broken commit never produces a bad deploy.
      # Failures here block deploy but do NOT cancel the hourly schedule —
      # the next hourly run will retry automatically.
      - name: Run tests
        run: uv run pytest -q

      - name: Build static site
        run: uv run python build_static.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  commit-history:
    # Run after deploy so the history push never changes master HEAD before
    # the Pages API validates the build version against the branch SHA.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Rebuild history snapshot
        run: uv run python build_static.py

      - name: Commit appended history partition
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/history)" ]; then
            git add data/history
            git commit -m "history: hourly snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "no history change to commit"
          fi
