name: Build and deploy static dashboard to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Refresh every hour (cron is UTC)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; never cancel an in-progress deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -q

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: uv run python build_static.py

      # Upload the history partition as a separate artifact so the
      # commit-history job can persist it AFTER the Pages deploy succeeds,
      # keeping the repo HEAD stable during the deploy step.
      - name: Save history snapshot
        uses: actions/upload-artifact@v4
        with:
          name: history-snapshot
          path: data/history/
          retention-days: 1
          if-no-files-changed: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  commit-history:
    # Runs after a successful deploy so git push never advances HEAD before
    # deploy-pages validates pages_build_version against the branch SHA.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download history snapshot
        uses: actions/download-artifact@v4
        with:
          name: history-snapshot
          path: data/history/

      - name: Commit appended history partition
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          if [ -n "$(git status --porcelain data/history)" ]; then
            git add data/history
            git commit -m "history: hourly snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "no history change to commit"
          fi
