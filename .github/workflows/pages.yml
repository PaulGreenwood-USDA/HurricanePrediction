name: Build and deploy static dashboard to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Refresh every hour (cron is UTC)
    - cron: "17 * * * *"
  workflow_dispatch:

# Minimal default; each job grants only what it needs.
permissions:
  contents: read

# Only one Pages deploy at a time; never cancel an in-progress deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the history snapshot commit
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build static site
        run: uv run python build_static.py

      - name: Commit appended history partition
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/history)" ]; then
            git add data/history
            git commit -m "history: hourly snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "no history change to commit"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
