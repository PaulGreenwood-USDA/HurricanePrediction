[project]
name = "hurricane-asheville"
version = "0.1.0"
description = "Tropical-cyclone risk and live flood-hazard analytics for Asheville, NC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=17.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pypdf>=6.10.2",
    "requests>=2.33.1",
]

[project.scripts]
hurricane-asheville = "hurricane_asheville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hurricane_asheville"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
